<main class="auth-page">
  <h1>Reset your password</h1>
  @if (sent()) {
  <p class="subtitle">
    If that email belongs to an admin account, a reset link is on its way. It works once and expires
    in 30 minutes.
  </p>
  } @else {
  <p class="subtitle">We'll email you a link to set a new password.</p>
  <form [formGroup]="form" (ngSubmit)="send()" novalidate>
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" type="email" autocomplete="username" />
    </mat-form-field>
    @if (error(); as message) {
    <p class="error" role="alert">{{ message }}</p>
    }
    <button mat-flat-button type="submit" [disabled]="busy()">Send reset link</button>
  </form>
  }
  <a class="footnote" routerLink="/login">Back to sign in</a>
</main>
