name: CI

on:
  pull_request:
  push:
    branches: [main, snapshot, snapshot-dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check:colours
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Check the API contract and client are regenerated
        run: |
          pnpm generate:client
          if [ -n "$(git status --porcelain -- libs/contracts)" ]; then
            git status --porcelain -- libs/contracts
            echo "::error::libs/contracts is out of date. Run pnpm generate:client and commit the result."
            exit 1
          fi

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: companion
          POSTGRES_PASSWORD: companion
          POSTGRES_DB: companion_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U companion -d companion_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    # The image pre-installs PostGIS and its add-ons in POSTGRES_DB; the built-in `postgres`
    # database starts empty, like the local image and a new Supabase project.
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://companion:companion@localhost:5432/postgres
      MIGRATION_DATABASE_URL: postgresql://companion:companion@localhost:5432/postgres
      DATABASE_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm migration:verify
      - run: pnpm test:db
